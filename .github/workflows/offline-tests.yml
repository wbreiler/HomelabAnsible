name: Offline tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proxmox
    env:
      # These fixtures need only ansible-core, not the configured collection callback.
      ANSIBLE_STDOUT_CALLBACK: default
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements.txt PyYAML Jinja2
      - name: Run host-independent Python tests
        # Extend this explicit list when new offline regression tests are merged.
        # Unrestricted discovery also imports guest-only application code.
        run: |
          python tests/test_iptag.py
          python tests/test_zipline_client.py
          python tests/test_service_boundaries.py
          python tests/test_logging_ingress.py
          python tests/test_lxc_auto_update.py
          python tests/test_lxc_app_updates.py
          python tests/test_native_app_updates.py
          python tests/test_lxc_update_notifications.py
          python tests/test_local_dns.py
          python tests/test_homebridge_mdns_proxy.py
          python tests/test_netdata.py
          python tests/test_app_observer.py
          python tests/test_lancache.py
      - name: Run localhost ownership and check-mode fixtures
        run: |
          ansible-playbook -i localhost, tests/terraform-ownership.yml
          ansible-playbook -i localhost, tests/check-mode.yml
          ansible-playbook -i localhost, tests/terraform-platform-ownership.yml
