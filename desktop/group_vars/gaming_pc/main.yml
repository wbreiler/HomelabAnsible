# These packages belong to the interactive Techn profile. Installing them over
# WinRM would put them in the local ansible account instead.
gaming_pc_interactive_user_packages:
  - name: Apple Music
    applies_to: all
  - name: Discord
    applies_to: all
  - name: iCloud for Windows
    applies_to: all
  - name: AMD Radeon Software
    applies_to: AMD GPU
  - name: Intel Graphics Software
    applies_to: Intel GPU
  - name: NVIDIA App
    applies_to: NVIDIA GPU

gaming_pc_install_windows_updates: true
gaming_pc_install_driver_updates: true
gaming_pc_reboot_after_updates: true

gaming_pc_windows_optional_features:
  - VirtualMachinePlatform

gaming_pc_smb_drive_letter: Z
gaming_pc_smb_path: '\\10.10.20.3\clips'
gaming_pc_smb_username: wbreiler
