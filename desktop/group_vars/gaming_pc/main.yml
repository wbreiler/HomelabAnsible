# These packages belong to the interactive Techn profile. Installing them over
# WinRM would put them in the local ansible account instead.
gaming_pc_interactive_user_packages:
  - name: ASTRO Command Center
    applies_to: all
  - name: ChatGPT
    applies_to: all
  - name: iCloud for Windows
    applies_to: all

gaming_pc_install_motherboard_drivers: true
gaming_pc_expected_motherboard_manufacturer: Gigabyte Technology Co., Ltd.
gaming_pc_expected_motherboard_product: X870 EAGLE WIFI7

# Versioned packages published for the X870 EAGLE WIFI7 (rev. 1.x). Wireless
# hardware differs by board revision, so the role discovers Realtek vs.
# MediaTek and installs only the matching set.
gaming_pc_motherboard_driver_packages:
  - name: AMD X870 chipset
    version: 8.03.25.247
    hardware: always
    installer_arguments: /S
    url: >-
      https://download.gigabyte.com/FileList/Driver/mb_driver_597_chipset_8.03.25.247.zip?v=fc44742a45b2f8a2054e82289f94704e
