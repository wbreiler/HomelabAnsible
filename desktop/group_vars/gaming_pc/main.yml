    id: 7zip.7zip
    source: winget
  - name: 1Password
    id: AgileBits.1Password
    source: winget
  - name: Audacity
    id: Audacity.Audacity
    source: winget
  - name: Bambu Studio
    id: Bambulab.Bambustudio
    source: winget
  - name: Battle.net
    id: Blizzard.BattleNet
    source: winget
  - name: CrystalDiskInfo
    id: CrystalDewWorld.CrystalDiskInfo
    source: winget
  - name: HandBrake
    id: HandBrake.HandBrake
    source: winget
  - name: Node.js LTS
    id: OpenJS.NodeJS.LTS
    source: winget
  - name: OBS Studio
    id: OBSProject.OBSStudio
    source: winget
  - name: Parsec
