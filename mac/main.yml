---
- name: Provision an Apple silicon Mac
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  vars:
    home_dir: "{{ ansible_facts.env.HOME }}"
    username: "{{ ansible_facts.env.USER }}"
    homebrew_prefix: /opt/homebrew
    mac_profiles: [main]
    mac_dev_remote_access: false
  pre_tasks:
    - name: Validate platform and selected roles
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Darwin'
          - ansible_facts.architecture == 'arm64'
          - home_dir != '/var/root'
          - mac_profiles is sequence and mac_profiles is not string
          - mac_profiles | length > 0
          - mac_profiles | difference(['main', 'dev']) | length == 0
        fail_msg: Select main, dev, or both on an Apple silicon Mac as the normal user.
      tags: [always]
  tasks:
    - name: Apply everyday Mac role
      ansible.builtin.import_role:
        name: mac_main
      when: "'main' in mac_profiles"

    - name: Apply development Mac role
      ansible.builtin.import_role:
        name: mac_dev
      when: "'dev' in mac_profiles"
