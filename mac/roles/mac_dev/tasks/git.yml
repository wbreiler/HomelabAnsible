---
- name: Configure git user name
  community.general.git_config:
    name: user.name
    value: "Will Breiler"
    scope: global

- name: Configure git user email
  community.general.git_config:
    name: user.email
    value: "will.breiler@gmail.com"
    scope: global

- name: Install git-lfs hooks
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/git-lfs install"
  changed_when: false
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
