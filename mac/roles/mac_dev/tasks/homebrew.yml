---
- name: Create the development applications directory
  ansible.builtin.file:
    path: "{{ mac_dev_app_dir }}"
    state: directory
    mode: "0755"
  when: mac_dev_app_dir != '/Applications'

- name: Install mac_dev Homebrew formulae
  community.general.homebrew:
    name: "{{ item }}"
    state: present
    path: "{{ homebrew_prefix }}/bin"
  loop: "{{ mac_dev_formulae + (mac_dev_arm_formulae if ansible_facts.architecture == 'arm64' else []) }}"
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
- name: Install mac_dev Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    path: "{{ homebrew_prefix }}/bin"
    install_options: ["appdir={{ mac_dev_app_dir }}"]
  loop: "{{ mac_dev_casks }}"
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
