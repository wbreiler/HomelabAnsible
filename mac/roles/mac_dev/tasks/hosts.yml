---
# Adds homelab host entries to /etc/hosts
# Address audit and retirement records: mac/HOSTS-AUDIT.md
# Requires become: true (sudo) — run with: make run-dev (prompts for sudo password)

- name: Add homelab hosts to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - homelab hosts"
    block: |
      10.10.30.3      prometheus
      10.10.30.9      atlas
      10.10.20.2      mnemosyne
      10.10.10.7      erebus
      10.10.40.236    pocketid-nash
      10.10.40.86     npm-nash
      10.10.40.170    pxe-nash
      10.10.40.87     prowlarr-nash
      10.10.40.52     sonarr-nash
      10.10.40.131    radarr-nash
      10.10.20.3      deluge-nash
      10.10.40.243    sabnzbd-nash
      10.10.40.172    seerr-nash overseerr-nash
      10.10.40.177    openwebui-nash
      10.10.40.117    searxng-nash
      10.10.40.183    git-mirror-nash
      10.10.40.38     forgejo-nash
      10.10.40.185    atm10-nash
      10.10.40.186    homestead-nash
      10.10.40.202    yabu-nash
