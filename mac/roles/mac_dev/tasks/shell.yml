---
- name: Check if Oh My Zsh is installed
  ansible.builtin.stat:
    path: "{{ home_dir }}/.oh-my-zsh"
  register: mac_dev_omz_stat

- name: Install Oh My Zsh (unattended)
  ansible.builtin.shell: >
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  args:
    creates: "{{ home_dir }}/.oh-my-zsh"
  when: not mac_dev_omz_stat.stat.exists
  environment:
    HOME: "{{ home_dir }}"

- name: Copy .zshrc
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/zshrc.j2"
    dest: "{{ home_dir }}/.zshrc"
    backup: true
    mode: "0644"

- name: Copy .zprofile
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/zprofile.j2"
    dest: "{{ home_dir }}/.zprofile"
    backup: true
    mode: "0644"

- name: Install zsh-syntax-highlighting
  community.general.homebrew:
    name: zsh-syntax-highlighting
    state: present
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"

- name: Install pyenv Python 3.14.0
  ansible.builtin.command: >
    {{ homebrew_prefix }}/bin/pyenv install 3.14.0
  args:
    creates: "{{ home_dir }}/.pyenv/versions/3.14.0"
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
    PYENV_ROOT: "{{ home_dir }}/.pyenv"
  ignore_errors: true # noqa ignore-errors -- retain existing optional language package behavior

- name: Set pyenv global Python version
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/pyenv global 3.14.0"
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
    PYENV_ROOT: "{{ home_dir }}/.pyenv"
  register: mac_dev_pyenv_global
  changed_when: mac_dev_pyenv_global.rc == 0 and 'already' not in mac_dev_pyenv_global.stdout
  ignore_errors: true # noqa ignore-errors -- retain existing optional language package behavior

- name: Install global pip packages
  ansible.builtin.pip:
    name: "{{ item }}"
    state: present
    executable: "{{ home_dir }}/.pyenv/versions/3.14.0/bin/pip3"
  loop:
    - beautifulsoup4
    - numpy
    - pillow
    - proxmoxer
    - mcp
  ignore_errors: true # noqa ignore-errors -- retain existing optional language package behavior

- name: Install global npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
    executable: "{{ homebrew_prefix }}/bin/npm"
  loop:
    - wrangler
  environment:
    PATH: "{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  ignore_errors: true # noqa ignore-errors -- retain existing optional language package behavior

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /bin/zsh
  become: true
