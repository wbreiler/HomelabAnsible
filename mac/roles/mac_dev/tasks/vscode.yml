---
- name: Ensure VS Code User directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/Library/Application Support/Code/User"
    state: directory
    mode: "0755"

- name: Copy VS Code settings
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/vscode_settings.json.j2"
    dest: "{{ home_dir }}/Library/Application Support/Code/User/settings.json"
    backup: true
    mode: "0644"

- name: Install VS Code extensions
  ansible.builtin.command: >
    code --install-extension {{ item }} --force
  loop:
    - alexcvzz.vscode-sqlite
    - anthropic.claude-code
    - astro-build.astro-vscode
    - beardedbear.beardedicons
    - beardedbear.beardedtheme
    - clutchengineering.obdb-tooling
    - cyberbookas.system-syntax
    - davidanson.vscode-markdownlint
    - github.copilot-chat
    - google.gemini-cli-vscode-ide-companion
    - google.geminicodeassist
    - leonardssh.vscord
    - llvm-vs-code-extensions.lldb-dap
    - mateocerquetella.xcode-12-theme
    - mechatroner.rainbow-csv
    - ms-azuretools.vscode-containers
    - ms-azuretools.vscode-docker
    - ms-python.debugpy
    - ms-python.python
    - ms-python.vscode-pylance
    - ms-python.vscode-python-envs
    - ms-vscode-remote.remote-containers
    - ms-vscode-remote.remote-ssh
    - ms-vscode-remote.remote-ssh-edit
    - ms-vscode-remote.remote-wsl
    - ms-vscode.powershell
    - ms-vscode.remote-explorer
    - redhat.ansible
    - redhat.vscode-yaml
    - repreng.csv
    - swiftlang.swift-vscode
    - tamasfe.even-better-toml
    - tommasov.hosts
  environment:
    PATH: "/usr/local/bin:{{ homebrew_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  register: mac_dev_vscode_ext_result
  changed_when: "'already installed' not in mac_dev_vscode_ext_result.stdout"
  failed_when: false
