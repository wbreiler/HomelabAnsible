---
# Adds homelab host entries to /etc/hosts
# Requires become: true (sudo) — run with: make run (prompts for sudo password)

- name: Add homelab hosts to /etc/hosts
  blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED - homelab hosts"
    block: |
      192.168.1.210   pve-nash-1
      192.168.1.19    pve-nash-2
      192.168.1.82    pve-nash-3
      192.168.1.181   pve-nash-4
      192.168.1.39    forgejo-nash
      192.168.1.87    prowlarr-nash
      192.168.1.237   homebridge-nash
      192.168.1.173   overseerr-nash
      192.168.1.183   git-mirror-nash
      192.168.1.97    pulse-nash
      192.168.1.86    npm-nash
      192.168.1.236   pocketid-nash
      192.168.1.71    discopanel-nash
      192.168.1.175   apt-nash
      192.168.1.191   hytale-nash
      192.168.1.201   storage-nash
      192.168.1.68    octo-nash-1
  become: true
