---
- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.ssh"
    state: directory
    mode: "0700"

- name: Copy SSH config
  ansible.builtin.copy:
    src: files/ssh_config
    dest: "{{ home_dir }}/.ssh/config"
    mode: "0600"
    backup: true

- name: Remove obsolete 1Password SSH agent configuration
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/1Password"
    state: absent

# NOTE: Private SSH keys are NOT managed by this playbook.
# Add them manually or restore them from a secure backup:
#   - PiKeys (stored at ~/.ssh/PiKeys)
# The Bitwarden SSH agent (configured in ~/.ssh/config) handles
# authentication for most hosts while Bitwarden is running.
