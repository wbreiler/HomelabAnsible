---
- name: Check if Xcode CLT is installed
  ansible.builtin.command: xcode-select -p
  register: xcode_clt_check
  changed_when: false
  failed_when: false

- name: Trigger Xcode CLT install (non-interactive, via softwareupdate)
  when: xcode_clt_check.rc != 0
  block:
    - name: Create softwareupdate trigger file
      ansible.builtin.file:
        path: /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        state: touch
        mode: "0644"

    - name: Find Xcode CLT package label # noqa risky-shell-pipe -- grep has no match until Apple offers CLT
      ansible.builtin.shell: softwareupdate -l | grep -B1 "Command Line Tools" | awk -F"*" '/^\*/{print $2}' | sed 's/^ *//' | tail -1
      register: xcode_clt_label
      changed_when: false

    - name: Install Xcode CLT via softwareupdate
      ansible.builtin.command: softwareupdate -i "{{ xcode_clt_label.stdout }}" --verbose
      when: xcode_clt_label.stdout != ""
      become: true
      changed_when: true

    - name: Remove trigger file
      ansible.builtin.file:
        path: /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        state: absent
