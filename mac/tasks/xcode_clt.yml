---
- name: Check if Xcode CLT is installed
  command: xcode-select -p
  register: xcode_clt_check
  changed_when: false
  failed_when: false

- name: Trigger Xcode CLT install (non-interactive, via softwareupdate)
  when: xcode_clt_check.rc != 0
  block:
    - name: Create softwareupdate trigger file
      file:
        path: /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        state: touch

    - name: Find Xcode CLT package label
      shell: softwareupdate -l | grep -B1 "Command Line Tools" | awk -F"*" '/^\*/{print $2}' | sed 's/^ *//' | tail -1
      register: xcode_clt_label
      changed_when: false

    - name: Install Xcode CLT via softwareupdate
      command: softwareupdate -i "{{ xcode_clt_label.stdout }}" --verbose
      when: xcode_clt_label.stdout != ""

    - name: Remove trigger file
      file:
        path: /tmp/.com.apple.dt.CommandLineTools.installondemand.in-progress
        state: absent
