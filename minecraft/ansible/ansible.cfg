[defaults]
inventory               = hosts.ini
interpreter_python      = auto_silent
private_key_file        = ~/.ssh/lxc_nash
inject_facts_as_vars    = True
remote_user     = root
roles_path      = roles
retry_files_enabled = False
stdout_callback = ansible.builtin.default
callback_result_format = yaml

[ssh_connection]
pipelining    = True
# accept-new: trust on first use, but detect key changes (MITM) afterwards
ssh_args      = -o StrictHostKeyChecking=accept-new -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s
# control_path matches ~/.ssh/config's ControlPath (10.10.40.* proxmox guests)
# so ansible reuses the same long-lived (ControlPersist 24h) connection
# instead of opening its own short-lived one.
control_path  = /Users/wbreiler/.ssh/sockets/%%r@%%h:%%p
