---
- name: Require Terraform for HA policy
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Stop the retired HA configuration workflow
      ansible.builtin.fail:
        msg: >-
          Terraform owns Proxmox HA resources and affinity rules. Review their
          existing definitions in terraform/proxmox instead of applying Ansible HA policy.
