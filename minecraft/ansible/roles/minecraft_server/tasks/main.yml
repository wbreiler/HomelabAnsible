---
# roles/minecraft_server/tasks/main.yml
# Configures a Debian 12/Ubuntu LXC as a Minecraft server.
# All tasks are written to be idempotent.
# Supports pack_source: modrinth (default), curseforge, or vanilla (modpack_slug: vanilla).

###############################################################################
# 0. Compute java_version from mc_version
###############################################################################

- name: Compute Java version for this Minecraft release
  ansible.builtin.include_tasks: set_java_version.yml

###############################################################################
# 1. Configure apt proxy
###############################################################################

- name: Configure apt-cacher-ng proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/01proxy
    content: |
      Acquire::http::Proxy "{{ apt_cache_url }}";
    owner: root
    group: root
    mode: "0644"

###############################################################################
# 2. Update apt cache and install dependencies
###############################################################################

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install utility packages
  ansible.builtin.apt:
    name: [cron, curl, jq, openssl, unzip, rsync]
    state: present

- name: Set timezone to US/Central
  community.general.timezone:
    name: America/Chicago
  tags: timezone

# --- GraalVM CE (Java 21 for MC 1.21+, Java 25 for MC 26.x+) ---

- name: Check installed GraalVM CE major version
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      /opt/graalvm-ce/bin/java -version 2>&1 |
      grep -oP '(?<=version ")[0-9]+'
    executable: /bin/bash
  register: graalvm_installed_major
  failed_when: false
  changed_when: false
  when: jvm_distro == 'graalvm'

- name: Set graalvm_stat for skip logic
  ansible.builtin.set_fact:
    graalvm_stat:
      stat:
        exists: "{{ graalvm_installed_major.rc == 0 and (graalvm_installed_major.stdout | trim) == (java_version | string) }}"
  when: jvm_distro == 'graalvm'

- name: Download GraalVM CE {{ java_version }}
  ansible.builtin.get_url:
    url: "{{ graalvm_ce_url }}"
    dest: /tmp/graalvm-ce.tar.gz
    mode: "0644"
    timeout: 300
  when: jvm_distro == 'graalvm' and not (graalvm_stat.stat.exists | default(false))

- name: Create /opt/graalvm-ce
  ansible.builtin.file:
    path: /opt/graalvm-ce
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: jvm_distro == 'graalvm' and not (graalvm_stat.stat.exists | default(false))

- name: Extract GraalVM CE
  ansible.builtin.unarchive:
    src: /tmp/graalvm-ce.tar.gz
    dest: /opt/graalvm-ce
    remote_src: true
    extra_opts: ["--strip-components=1"]
  when:
    - not ansible_check_mode
    - jvm_distro == 'graalvm'
    - not (graalvm_stat.stat.exists | default(false))

- name: Register GraalVM CE as default java
  ansible.builtin.command:
    cmd: update-alternatives --install /usr/bin/java java /opt/graalvm-ce/bin/java 100
  when:
    - not ansible_check_mode
    - jvm_distro == 'graalvm'
    - not (graalvm_stat.stat.exists | default(false))
  changed_when: true

- name: Remove GraalVM CE archive
  ansible.builtin.file:
    path: /tmp/graalvm-ce.tar.gz
    state: absent
  when: jvm_distro == 'graalvm'

# --- Temurin (Java 17, MC 1.18–1.20.4) ---

- name: Create /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: jvm_distro == 'temurin'

- name: Add Adoptium apt signing key
  ansible.builtin.get_url:
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    dest: /etc/apt/keyrings/adoptium.asc
    mode: "0644"
  when: jvm_distro == 'temurin'

- name: Add Adoptium apt repository
  ansible.builtin.deb822_repository:
    name: adoptium
    types: deb
    uris: https://packages.adoptium.net/artifactory/deb
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /etc/apt/keyrings/adoptium.asc
    state: present
  when: jvm_distro == 'temurin'

- name: Install Temurin JDK {{ java_version }}
  ansible.builtin.apt:
    name: "temurin-{{ java_version }}-jdk"
    state: present
    update_cache: true
  when: jvm_distro == 'temurin'

# --- OpenJDK fallback (Java 8, MC 1.17 and below) ---

- name: Install OpenJDK {{ java_version }}
  ansible.builtin.apt:
    name: "openjdk-{{ java_version }}-jre-headless"
    state: present
  when: jvm_distro == 'openjdk'

###############################################################################
# 3. Create minecraft system user
###############################################################################

- name: Create minecraft system user
  ansible.builtin.user:
    name: minecraft
    system: true
    shell: /usr/sbin/nologin
    home: /opt/minecraft
    create_home: false
    comment: "Minecraft server daemon"

###############################################################################
# 4. Create required directories
###############################################################################

- name: Create Minecraft and config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('minecraft') }}"
    group: "{{ item.group | default('minecraft') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: /opt/minecraft }
    - { path: /opt/minecraft/mods }
    - { path: /opt/minecraft/world }
    - { path: /etc/minecraft, owner: root, group: minecraft, mode: "0750" }

- name: Reconcile existing mod ownership and permissions
  ansible.builtin.file:
    path: /opt/minecraft/mods
    owner: minecraft
    group: minecraft
    mode: u=rwX,g=rX,o=rX
    recurse: true

###############################################################################
# 5. Deploy update script and config
# Done early so CurseForge provisioning can call the script for its download.
###############################################################################

- name: Install update-modpack.sh
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../update-script/update-modpack.sh"
    dest: /usr/local/bin/update-modpack.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy /etc/minecraft/update.conf
  ansible.builtin.template:
    src: update.conf.j2
    dest: /etc/minecraft/update.conf
    owner: root
    group: minecraft
    mode: "0640"
  no_log: true

###############################################################################
# 6. Modpack download
# Use the same transactional updater for initial provisioning and later timer
# runs so there is only one staging, validation, swap, and rollback path.
###############################################################################

- name: Install latest modpack and restart Minecraft if needed
  ansible.builtin.command:
    cmd: /usr/local/bin/update-modpack.sh --no-wait
  register: minecraft_server_modpack_update
  when: modpack_slug != 'vanilla' and (pack_source | default('modrinth')) != 'manual'
  changed_when: >-
    'Already up to date. Exiting.'
    not in minecraft_server_modpack_update.stdout

###############################################################################
# 7. Vanilla server setup
###############################################################################

- name: Fetch Mojang version manifest
  ansible.builtin.uri:
    url: "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
    method: GET
    return_content: true
    headers:
      User-Agent: "MinecraftLXCAnsible/1.0 (will.breiler@gmail.com)"
    status_code: 200
  register: mojang_manifest
  when: modpack_slug == "vanilla"

- name: Extract version metadata URL for mc_version
  ansible.builtin.set_fact:
    mojang_version_meta_url: >-
      {{
        mojang_manifest.json.versions
        | selectattr('id', 'equalto', mc_version)
        | map(attribute='url')
        | first
      }}
  when: modpack_slug == "vanilla"

- name: Fetch individual version metadata
  ansible.builtin.uri:
    url: "{{ mojang_version_meta_url }}"
    method: GET
    return_content: true
    headers:
      User-Agent: "MinecraftLXCAnsible/1.0 (will.breiler@gmail.com)"
    status_code: 200
  register: mojang_version_meta
  when: modpack_slug == "vanilla"

- name: Extract server jar download URL
  ansible.builtin.set_fact:
    vanilla_server_jar_url: "{{ mojang_version_meta.json.downloads.server.url }}"
  when: modpack_slug == "vanilla"

- name: Download vanilla server jar
  ansible.builtin.get_url:
    url: "{{ vanilla_server_jar_url }}"
    dest: /opt/minecraft/server.jar
    owner: minecraft
    group: minecraft
    mode: "0644"
    timeout: 300
    checksum: "sha1:{{ mojang_version_meta.json.downloads.server.sha1 }}"
  when: modpack_slug == "vanilla"

###############################################################################
# 9. Migrate server data from an existing server (optional)
# Set migrate_from in servers.yml to rsync the full server directory before
# the server starts. rsync runs on the source host and pushes directly to
# this LXC — the Ansible controller is never in the data path. Agent
# forwarding supplies the SSH key from the controller's agent.
#
# Excluded from rsync (managed by this playbook):
#   mods/  libraries/  eula.txt  server.properties  ops.json  logs/  crash-reports/
#
# Idempotent: skipped if /opt/minecraft/.migrated already exists.
###############################################################################

- name: Check if migration has already run
  ansible.builtin.stat:
    path: /opt/minecraft/.migrated
  register: migration_sentinel
  when: migrate_from is defined

- name: Migrate server data directly from source to new server
  ansible.builtin.command:
    argv:
      - rsync
      - -az
      - --stats
      - "--rsh=ssh -A -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      - --exclude=mods/
      - --exclude=libraries/
      - --exclude=run.sh
      - --exclude=run.bat
      - --exclude=user_jvm_args.txt
      - --exclude=eula.txt
      - --exclude=server.properties
      - --exclude=ops.json
      - --exclude=logs/
      - --exclude=crash-reports/
      - "{{ migrate_from.src_base }}/"
      - "root@{{ hostvars[inventory_hostname]['ansible_host'] }}:/opt/minecraft/"
  delegate_to: "{{ (migrate_from | default({})).host | default(inventory_hostname) }}"
  when: migrate_from is defined and not migration_sentinel.stat.exists
  changed_when: true

- name: Fix ownership of migrated files
  ansible.builtin.file:
    path: /opt/minecraft
    owner: minecraft
    group: minecraft
    recurse: true
  when: migrate_from is defined and not migration_sentinel.stat.exists

- name: Mark migration complete
  ansible.builtin.copy:
    content: "{{ ansible_date_time.iso8601 }}\n"
    dest: /opt/minecraft/.migrated
    owner: root
    group: root
    mode: "0444"
  when: migrate_from is defined and not migration_sentinel.stat.exists

###############################################################################
# 9b. Deploy user_jvm_args.txt for NeoForge/Forge packs
# NeoForge/Forge read JVM flags from this file via run.sh rather than the
# command line. Deployed after migration so it always reflects Ansible's values.
###############################################################################

- name: Deploy user_jvm_args.txt for NeoForge/Forge packs
  ansible.builtin.template:
    src: user_jvm_args.txt.j2
    dest: /opt/minecraft/user_jvm_args.txt
    owner: minecraft
    group: minecraft
    mode: "0644"
  when: (loader | default('')) in ['neoforge', 'forge']

###############################################################################
# 9c. Fabric/Quilt server setup
# Fabric uses a named launcher jar (fabric-server-mc.X-loader.X-launcher.X.jar)
# rather than server.jar. If one was migrated from an existing server, symlink it
# as server.jar. If not present (fresh install), download and run the Fabric
# installer, which creates server.jar directly.
###############################################################################

- name: Check if server.jar already exists for Fabric/Quilt pack
  ansible.builtin.stat:
    path: /opt/minecraft/server.jar
  register: _server_jar_stat
  when: (loader | default('')) in ['fabric', 'quilt']

- name: Find migrated Fabric launcher jar
  ansible.builtin.find:
    paths: /opt/minecraft
    patterns: "fabric-server-*.jar"
    depth: 1
  register: _fabric_launcher_jars
  when:
    - (loader | default('')) in ['fabric', 'quilt']
    - not (_server_jar_stat.stat.exists | default(false))

- name: Symlink migrated Fabric launcher jar as server.jar
  ansible.builtin.file:
    src: "{{ (_fabric_launcher_jars.files | sort(attribute='mtime') | last).path | basename }}"
    dest: /opt/minecraft/server.jar
    state: link
    owner: minecraft
    group: minecraft
  when:
    - (loader | default('')) in ['fabric', 'quilt']
    - not (_server_jar_stat.stat.exists | default(false))
    - (_fabric_launcher_jars.files | default([]) | length) > 0

- name: Fetch latest stable Fabric installer version
  ansible.builtin.uri:
    url: https://meta.fabricmc.net/v2/versions/installer
    return_content: true
  register: _fabric_installer_meta
  when:
    - (loader | default('')) in ['fabric', 'quilt']
    - not (_server_jar_stat.stat.exists | default(false))
    - (_fabric_launcher_jars.files | default([]) | length) == 0

- name: Download Fabric installer
  ansible.builtin.get_url:
    url: "{{ (_fabric_installer_meta.json | selectattr('stable', 'equalto', true) | first).url }}"
    dest: /tmp/fabric-installer.jar
    mode: "0644"
    timeout: 120
  when:
    - (loader | default('')) in ['fabric', 'quilt']
    - not (_server_jar_stat.stat.exists | default(false))
    - (_fabric_launcher_jars.files | default([]) | length) == 0

- name: Run Fabric installer to create server.jar
  ansible.builtin.command:
    cmd: java -jar /tmp/fabric-installer.jar server -dir /opt/minecraft -mcversion {{ mc_version }} -downloadMinecraft
  when:
    - (loader | default('')) in ['fabric', 'quilt']
    - not (_server_jar_stat.stat.exists | default(false))
    - (_fabric_launcher_jars.files | default([]) | length) == 0
  changed_when: true

- name: Remove Fabric installer
  ansible.builtin.file:
    path: /tmp/fabric-installer.jar
    state: absent
  when: (loader | default('')) in ['fabric', 'quilt']

- name: Fix ownership of Fabric server files
  ansible.builtin.file:
    path: /opt/minecraft
    owner: minecraft
    group: minecraft
    recurse: true
  when:
    - (loader | default('')) in ['fabric', 'quilt']
    - not (_server_jar_stat.stat.exists | default(false))

###############################################################################
# 9d. Forge/NeoForge loader install for manually-provided packs
# pack_source: manual means the mods/config/etc were dropped into /opt/minecraft
# by hand (e.g. from a ServerPackCreator zip) instead of fetched by
# update-modpack.sh, so nothing has installed the loader yet. Requires
# loader_version (e.g. "47.4.20") on the server entry.
###############################################################################

- name: Check if run.sh already exists (manual pack)
  ansible.builtin.stat:
    path: /opt/minecraft/run.sh
  register: _manual_run_sh_stat
  when:
    - (pack_source | default('modrinth')) == 'manual'
    - (loader | default('')) in ['forge', 'neoforge']

- name: Download Forge installer (manual pack)
  ansible.builtin.get_url:
    url: "https://maven.minecraftforge.net/net/minecraftforge/forge/{{ mc_version }}-{{ loader_version }}/forge-{{ mc_version }}-{{ loader_version }}-installer.jar"
    dest: /tmp/loader-installer.jar
    mode: "0644"
    timeout: 300
  when:
    - (pack_source | default('modrinth')) == 'manual'
    - loader | default('') == 'forge'
    - not (_manual_run_sh_stat.stat.exists | default(false))

- name: Download NeoForge installer (manual pack)
  ansible.builtin.get_url:
    url: "https://maven.neoforged.net/releases/net/neoforged/neoforge/{{ loader_version }}/neoforge-{{ loader_version }}-installer.jar"
    dest: /tmp/loader-installer.jar
    mode: "0644"
    timeout: 300
  when:
    - (pack_source | default('modrinth')) == 'manual'
    - loader | default('') == 'neoforge'
    - not (_manual_run_sh_stat.stat.exists | default(false))

- name: Run loader installer (manual pack)
  ansible.builtin.command:
    cmd: java -jar /tmp/loader-installer.jar --installServer
    chdir: /opt/minecraft
  when:
    - (pack_source | default('modrinth')) == 'manual'
    - (loader | default('')) in ['forge', 'neoforge']
    - not (_manual_run_sh_stat.stat.exists | default(false))
  changed_when: true

- name: Remove loader installer jar (manual pack)
  ansible.builtin.file:
    path: /tmp/loader-installer.jar
    state: absent
  when:
    - (pack_source | default('modrinth')) == 'manual'
    - (loader | default('')) in ['forge', 'neoforge']

- name: Fix ownership and run.sh permissions after loader install (manual pack)
  ansible.builtin.file:
    path: /opt/minecraft
    owner: minecraft
    group: minecraft
    recurse: true
  when:
    - (pack_source | default('modrinth')) == 'manual'
    - (loader | default('')) in ['forge', 'neoforge']
    - not (_manual_run_sh_stat.stat.exists | default(false))

- name: Ensure run.sh is executable (manual pack)
  ansible.builtin.file:
    path: /opt/minecraft/run.sh
    mode: "0755"
  when:
    - (pack_source | default('modrinth')) == 'manual'
    - (loader | default('')) in ['forge', 'neoforge']

###############################################################################
# 10. EULA, server.properties, ops.json
###############################################################################

- name: Accept Minecraft EULA
  ansible.builtin.copy:
    content: "eula=true\n"
    dest: /opt/minecraft/eula.txt
    owner: minecraft
    group: minecraft
    mode: "0644"

- name: Check for an existing RCON password
  ansible.builtin.stat:
    path: /etc/minecraft/rcon.password
  register: minecraft_server_rcon_password_file
  when: dh_pregen_enabled | default(false) | bool

- name: Generate RCON password
  ansible.builtin.command:
    argv:
      - /usr/bin/openssl
      - rand
      - -hex
      - "32"
  register: minecraft_server_generated_rcon_password
  changed_when: true
  no_log: true
  when:
    - dh_pregen_enabled | default(false) | bool
    - not minecraft_server_rcon_password_file.stat.exists
    - not ansible_check_mode

- name: Store generated RCON password
  ansible.builtin.copy:
    content: "{{ minecraft_server_generated_rcon_password.stdout }}\n"
    dest: /etc/minecraft/rcon.password
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - dh_pregen_enabled | default(false) | bool
    - not minecraft_server_rcon_password_file.stat.exists
    - not ansible_check_mode

- name: Read RCON password
  ansible.builtin.slurp:
    src: /etc/minecraft/rcon.password
  register: minecraft_server_rcon_password_slurp
  no_log: true
  when:
    - dh_pregen_enabled | default(false) | bool
    - minecraft_server_rcon_password_file.stat.exists or not ansible_check_mode

- name: Set RCON password for server configuration
  ansible.builtin.set_fact:
    minecraft_server_rcon_password: >-
      {{ minecraft_server_rcon_password_slurp.content | b64decode | trim }}
  no_log: true
  when:
    - dh_pregen_enabled | default(false) | bool
    - minecraft_server_rcon_password_file.stat.exists or not ansible_check_mode

- name: Read current RCON server properties
  ansible.builtin.slurp:
    src: /opt/minecraft/server.properties
  register: minecraft_server_current_properties
  no_log: true

- name: Compute current and desired RCON properties
  ansible.builtin.set_fact:
    minecraft_server_current_rcon_properties: >-
      {{
        (minecraft_server_current_properties.content | b64decode).splitlines()
        | select('match', '^(enable-rcon|rcon\.port|broadcast-rcon-to-ops|rcon\.password)=')
        | list
      }}
    minecraft_server_desired_rcon_properties: >-
      {{
        [
          'enable-rcon=true',
          'rcon.port=' ~ ((server_properties | default({})).rcon_port | default(25575) | string),
          'broadcast-rcon-to-ops=false',
          'rcon.password=' ~ (
            minecraft_server_rcon_password
            | default((server_properties | default({})).rcon_password | default(''))
          ),
        ]
        if
          ((server_properties | default({})).enable_rcon | default(false) | bool)
          or (dh_pregen_enabled | default(false) | bool)
        else []
      }}
  no_log: true

- name: Deploy server.properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: /opt/minecraft/server.properties
    owner: minecraft
    group: minecraft
    mode: "0640"

- name: Request restart when RCON settings change
  ansible.builtin.command: /bin/true
  changed_when: >-
    minecraft_server_current_rcon_properties
    != minecraft_server_desired_rcon_properties
  no_log: true
  notify: Restart Minecraft service

- name: Look up Mojang UUIDs for ops players
  ansible.builtin.uri:
    url: "https://api.mojang.com/users/profiles/minecraft/{{ item }}"
    method: GET
    return_content: true
    status_code: [200, 404]
  register: ops_uuid_lookup
  loop: "{{ ops | default([]) }}"
  when: (ops | default([]) | length) > 0

- name: Deploy ops.json
  ansible.builtin.template:
    src: ops.json.j2
    dest: /opt/minecraft/ops.json
    owner: minecraft
    group: minecraft
    mode: "0644"
  when: (ops | default([]) | length) > 0

###############################################################################
# 11. Optional BlueMap installation and configuration
###############################################################################

- name: Validate BlueMap resource-download acceptance
  ansible.builtin.assert:
    that:
      - bluemap_accept_download | default(false) | bool
    fail_msg: >-
      BlueMap requires bluemap_accept_download: true to acknowledge its Mojang
      client-resource download terms.
  when: bluemap_enabled | default(false) | bool

- name: Install checksum-verified BlueMap jar
  ansible.builtin.get_url:
    url: "{{ minecraft_server_bluemap_jar_url }}"
    dest: "/opt/minecraft/mods/bluemap-{{ minecraft_server_bluemap_version }}.jar"
    checksum: "sha512:{{ minecraft_server_bluemap_jar_sha512 }}"
    owner: minecraft
    group: minecraft
    mode: "0644"
  when: bluemap_enabled | default(false) | bool
  notify: Restart Minecraft service

- name: Find superseded BlueMap jars
  ansible.builtin.find:
    paths: /opt/minecraft/mods
    patterns: "bluemap-*.jar"
    file_type: file
  register: minecraft_server_bluemap_existing_jars
  when: bluemap_enabled | default(false) | bool

- name: Remove superseded BlueMap jars
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ minecraft_server_bluemap_existing_jars.files | default([]) }}"
  when:
    - bluemap_enabled | default(false) | bool
    - >-
      item.path != '/opt/minecraft/mods/bluemap-'
      ~ minecraft_server_bluemap_version ~ '.jar'
  notify: Restart Minecraft service

- name: Create BlueMap configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: minecraft
    group: minecraft
    mode: "0755"
  loop:
    - /opt/minecraft/config/bluemap
    - /opt/minecraft/config/bluemap/maps
  when: bluemap_enabled | default(false) | bool

- name: Deploy managed BlueMap configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: minecraft
    group: minecraft
    mode: "0644"
  loop:
    - src: bluemap-core.conf.j2
      dest: /opt/minecraft/config/bluemap/core.conf
    - src: bluemap-webapp.conf.j2
      dest: /opt/minecraft/config/bluemap/webapp.conf
    - src: bluemap-webserver.conf.j2
      dest: /opt/minecraft/config/bluemap/webserver.conf
    - src: bluemap-default-map.conf.j2
      dest: /opt/minecraft/config/bluemap/maps/default.conf
  when: bluemap_enabled | default(false) | bool
  notify: Restart Minecraft service

- name: Remove duplicate generated Overworld map
  ansible.builtin.file:
    path: /opt/minecraft/config/bluemap/maps/world.conf
    state: absent
  when: bluemap_enabled | default(false) | bool
  notify: Restart Minecraft service

###############################################################################
# 12. Deploy systemd minecraft@.service template
###############################################################################

- name: Deploy minecraft@.service systemd template unit
  ansible.builtin.template:
    src: minecraft@.service.j2
    dest: /etc/systemd/system/minecraft@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

###############################################################################
# 12. Deploy per-instance environment file (Xms / Xmx)
###############################################################################

- name: Deploy per-instance JVM environment file
  ansible.builtin.template:
    src: minecraft-instance.env.j2
    dest: "/etc/minecraft/{{ instance_name }}.env"
    owner: root
    group: minecraft
    mode: "0640"

###############################################################################
# 13. Deploy minecraft-update systemd units
###############################################################################

- name: Deploy minecraft-update.service
  ansible.builtin.template:
    src: minecraft-update.service.j2
    dest: /etc/systemd/system/minecraft-update.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  when: (pack_source | default('modrinth')) != 'manual'

- name: Deploy minecraft-update.timer
  ansible.builtin.template:
    src: minecraft-update.timer.j2
    dest: /etc/systemd/system/minecraft-update.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  when: (pack_source | default('modrinth')) != 'manual'

- name: Disable minecraft-update.timer for manually-managed packs
  ansible.builtin.systemd_service:
    name: minecraft-update.timer
    enabled: false
    state: stopped
  when: (pack_source | default('modrinth')) == 'manual'
  failed_when: false

###############################################################################
# 14. Flush handlers (daemon-reload) before enabling units
###############################################################################

- name: Flush handlers to ensure systemd is reloaded before enabling units
  ansible.builtin.meta: flush_handlers

###############################################################################
# 15. Enable and start Minecraft server service
###############################################################################

- name: Enable and start minecraft@{{ instance_name }}.service
  ansible.builtin.systemd_service:
    name: "minecraft@{{ instance_name }}.service"
    enabled: true
    state: started
    daemon_reload: false

###############################################################################
# 16. Manage Distant Horizons pre-generation controller
###############################################################################

- name: Create Distant Horizons pregen controller state directory
  ansible.builtin.file:
    path: /var/lib/minecraft-dh-pregen
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: dh_pregen_enabled | default(false) | bool

- name: Deploy Distant Horizons pregen controller
  ansible.builtin.template:
    src: dh-pregen-controller.py.j2
    dest: /usr/local/sbin/minecraft-dh-pregen
    owner: root
    group: root
    mode: "0755"
  when: dh_pregen_enabled | default(false) | bool

- name: Deploy Distant Horizons pregen cron job
  ansible.builtin.template:
    src: dh-pregen.cron.j2
    dest: /etc/cron.d/minecraft-dh-pregen
    owner: root
    group: root
    mode: "0644"
  when: dh_pregen_enabled | default(false) | bool

- name: Enable cron for Distant Horizons pregen controller
  ansible.builtin.systemd_service:
    name: cron.service
    enabled: true
    state: started
  when: dh_pregen_enabled | default(false) | bool

- name: Remove Distant Horizons pregen cron job when disabled
  ansible.builtin.file:
    path: /etc/cron.d/minecraft-dh-pregen
    state: absent
  when: not (dh_pregen_enabled | default(false) | bool)

###############################################################################
# 17. Enable and start update timer
###############################################################################

- name: Enable and start minecraft-update.timer
  ansible.builtin.systemd_service:
    name: minecraft-update.timer
    enabled: true
    state: started
    daemon_reload: false
  when: (pack_source | default('modrinth')) != 'manual'
