---
# tasks/set_java_version.yml
# Computes minecraft_server_java_version from mc_version using set_fact.
#
# Rules (from wiki.vg / Adoptium release schedule):
#   Java 25 — MC 26.x+ (new year-based versioning, major > 1)
#   Java 21 — MC 1.21+, or MC 1.20.5+
#   Java 17 — MC 1.18 – 1.20.4
#   Java 8  — MC 1.17 and below

- name: Parse Minecraft version components
  ansible.builtin.set_fact:
    minecraft_server_mc_parts: "{{ mc_version.split('.') }}"

- name: Set mc_minor and mc_patch integers
  ansible.builtin.set_fact:
    minecraft_server_mc_minor: "{{ minecraft_server_mc_parts[1] | int }}"
    minecraft_server_mc_patch: "{{ (minecraft_server_mc_parts[2] | default('0')) | int }}"

- name: Determine Java version
  ansible.builtin.set_fact:
    minecraft_server_java_version: >-
      {{
        25 if minecraft_server_is_year_version
        else 21 if minecraft_server_needs_java_21
        else 17 if minecraft_server_mc_minor | int >= 18
        else 8
      }}
  vars:
    minecraft_server_is_year_version: "{{ minecraft_server_mc_parts[0] | int > 1 }}"
    minecraft_server_needs_java_21: >-
      {{
        minecraft_server_mc_minor | int >= 21
        or (minecraft_server_mc_minor | int == 20 and minecraft_server_mc_patch | int >= 5)
      }}

- name: Set JVM distribution and flags
  ansible.builtin.set_fact:
    minecraft_server_jvm_distro: >-
      {{
        'graalvm' if minecraft_server_java_version | int in [21, 25]
        else 'temurin' if minecraft_server_java_version | int == 17
        else 'openjdk'
      }}
    minecraft_server_jvm_flags: >-
      {{
        minecraft_server_jvm_flags_graalvm25 if minecraft_server_java_version | int == 25
        else minecraft_server_jvm_flags_graalvm21 if minecraft_server_java_version | int == 21
        else minecraft_server_jvm_flags_aikar
      }}

- name: Select GraalVM CE download URL
  ansible.builtin.set_fact:
    minecraft_server_graalvm_ce_url: >-
      {{
        graalvm_ce_25_url if minecraft_server_java_version | int == 25
        else graalvm_ce_url
      }}
  when: minecraft_server_jvm_distro == 'graalvm'
