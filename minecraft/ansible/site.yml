---
# Reconcile already-provisioned Minecraft LXCs without creating, moving, or
# resizing containers and without modifying Proxmox backup jobs.
#
# Machine-specific host addresses and desired state live in ignored
# servers.yml. Use provision.yml only when creating a new LXC.

- name: Build inventory for existing Minecraft servers
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Load encrypted Minecraft vault
      ansible.builtin.include_vars:
        file: vault.yml
      no_log: true
      tags: always

  tasks:
    - name: Load local server definitions
      ansible.builtin.include_vars:
        file: servers.yml
        name: minecraft_server_defs
      tags: always

    - name: Select requested existing servers
      ansible.builtin.set_fact:
        minecraft_target_servers: >-
          {{
            minecraft_server_defs.servers
            | selectattr('hostname', 'equalto', server_filter)
            | list
            if server_filter is defined
            else minecraft_server_defs.servers
          }}
      tags: always

    - name: Validate existing-server inventory
      ansible.builtin.assert:
        that:
          - minecraft_target_servers | length > 0
          - >-
            minecraft_target_servers
            | selectattr('ansible_host', 'undefined')
            | list
            | length == 0
          - >-
            minecraft_target_servers
            | map(attribute='hostname')
            | list
            | unique
            | length == minecraft_target_servers | length
          - >-
            minecraft_target_servers
            | map(attribute='ansible_host')
            | reject('match', '^10\.10\.40\.[0-9]{1,3}$')
            | list
            | length == 0
        fail_msg: >-
          Define at least one unique server with an ansible_host on VLAN 40 in
          the ignored servers.yml file.
      tags: always

    - name: Add existing servers to the in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.hostname }}"
        groups: minecraft_existing
        ansible_host: "{{ item.ansible_host }}"
        hostname: "{{ item.hostname }}"
        vmid: "{{ item.vmid }}"
        node: "{{ item.node }}"
        pack_source: "{{ item.pack_source | default('modrinth') }}"
        modpack_slug: "{{ item.modpack_slug }}"
        pack_name: "{{ item.pack_name }}"
        mc_version: "{{ item.mc_version }}"
        loader: "{{ item.loader }}"
        loader_version: "{{ item.loader_version | default('') }}"
        instance_name: "{{ item.instance_name }}"
        discord_webhook_url: "{{ item.discord_webhook_url | default('') }}"
        curseforge_project_id: "{{ item.curseforge_project_id | default('') }}"
        exclude_cf_projects: "{{ item.exclude_cf_projects | default([]) }}"
        extra_modrinth_mods: "{{ item.extra_modrinth_mods | default([]) }}"
        bluemap_enabled: "{{ item.bluemap_enabled | default(false) }}"
        bluemap_accept_download: "{{ item.bluemap_accept_download | default(false) }}"
        bluemap_web_port: "{{ item.bluemap_web_port | default(8100) }}"
        bluemap_idle_update_enabled: "{{ item.bluemap_idle_update_enabled | default(false) }}"
        bluemap_idle_update_map: "{{ item.bluemap_idle_update_map | default('default') }}"
        dh_pregen_enabled: "{{ item.dh_pregen_enabled | default(false) }}"
        dh_pregen_dimension: "{{ item.dh_pregen_dimension | default('overworld') }}"
        dh_pregen_center_x: "{{ item.dh_pregen_center_x | default(0) }}"
        dh_pregen_center_z: "{{ item.dh_pregen_center_z | default(0) }}"
        dh_pregen_radius: "{{ item.dh_pregen_radius | default(500) }}"
        dh_pregen_followup_radius: "{{ item.dh_pregen_followup_radius | default(omit) }}"
        chunky_pregen_enabled: "{{ item.chunky_pregen_enabled | default(false) }}"
        chunky_pregen_world: "{{ item.chunky_pregen_world | default('world') }}"
        chunky_pregen_shape: "{{ item.chunky_pregen_shape | default('circle') }}"
        chunky_pregen_center_x: "{{ item.chunky_pregen_center_x | default(0) }}"
        chunky_pregen_center_z: "{{ item.chunky_pregen_center_z | default(0) }}"
        chunky_pregen_radius_chunks: "{{ item.chunky_pregen_radius_chunks | default(128) }}"
        xmx: "{{ item.xmx }}"
        xms: "{{ item.xms }}"
        server_properties: "{{ item.server_properties | default({}) }}"
        ops: "{{ item.ops | default([]) }}"
      loop: "{{ minecraft_target_servers }}"
      loop_control:
        label: "{{ item.hostname }} ({{ item.ansible_host }})"
      changed_when: false
      tags: always

- name: Reconcile existing Minecraft servers
  hosts: minecraft_existing
  serial: 1
  gather_facts: true

  pre_tasks:
    - name: Load encrypted Minecraft vault
      ansible.builtin.include_vars:
        file: vault.yml
      no_log: true
      tags: always

  roles:
    - minecraft_server
