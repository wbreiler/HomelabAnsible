[defaults]
inventory = inventory.yml
roles_path = roles
retry_files_enabled = False
# cluster-nash key is served by the 1Password SSH agent (IdentityAgent in ~/.ssh/config)
# private_key_file = ~/.ssh/cluster-nash
stdout_callback = ansible.posix.debug
callback_result_format = yaml
# Smart gathering with fact caching for improved performance
gathering = smart
fact_caching = jsonfile
# Store facts in project directory instead of /tmp for persistence
fact_caching_connection = .ansible/facts
fact_caching_timeout = 3600

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# accept-new: trust on first use, but detect key changes (MITM) afterwards
# control_path matches ~/.ssh/config's ControlPath so ansible reuses the same
# long-lived (ControlPersist 24h) multiplexed connection instead of opening
# its own short-lived one — avoids a fresh SSH-agent prompt on every run.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
control_path = /Users/wbreiler/.ssh/sockets/%%r@%%h:%%p
pipelining = True
