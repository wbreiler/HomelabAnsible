---
- name: Configure Apt-Cacher NG on existing Terraform-owned guests
  hosts: apt_cacher_ng_guests
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait for the Terraform-owned guest to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 1200
        connect_timeout: 10
        sleep: 5

    - name: Gather guest facts after SSH is ready
      ansible.builtin.setup:

    - name: Verify the Terraform guest identity before application changes
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == terraform_guest_name
        fail_msg: The SSH target does not match the Terraform guest identity.
      when: terraform_guest_name is defined
  roles:
    - role: apt_cacher_ng
      apt_cacher_ng_guest_ssh: true
