---
- name: Validate Apt-Cacher NG configuration
  ansible.builtin.assert:
    that:
      - apt_cacher_ng_port | int >= 1
      - apt_cacher_ng_port | int <= 65535
      - apt_cacher_ng_pass_through_pattern | length > 0
    fail_msg: >-
      Apt-Cacher NG requires a TCP port from 1 to 65535 and a non-empty
      pass-through pattern.

- name: Configure Apt-Cacher NG through the existing node workflow
  ansible.builtin.include_tasks: lxc.yml
  when: not (apt_cacher_ng_guest_ssh | bool)

- name: Configure Apt-Cacher NG directly on an existing guest
  ansible.builtin.include_tasks: guest.yml
  when: apt_cacher_ng_guest_ssh | bool
