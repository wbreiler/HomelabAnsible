---
- name: Validate Bambuddy configuration
  ansible.builtin.assert:
    that:
      - bambuddy_version | length > 0
      - bambuddy_release_checksum is match('^sha256:[0-9a-f]{64}$')
      - bambuddy_port | int >= 1
      - bambuddy_port | int <= 65535
    fail_msg: >-
      Bambuddy requires a pinned version, SHA-256 checksum, and a TCP port from
      1 to 65535.

- name: Resolve node currently hosting Bambuddy
  ansible.builtin.include_tasks: ../../../tasks/resolve_lxc_node.yml
  vars:
    lxc_lookup_hostname: "{{ bambuddy_hostname }}"
    lxc_fallback_node: "{{ bambuddy_node }}"

- name: Set up Bambuddy LXC on hosting node only
  when: proxmox_node_name | default(inventory_hostname) == lxc_current_node
  block:
    - name: Bootstrap Bambuddy container
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/create_lxc.yml"
      vars:
        lxc_hostname: "{{ bambuddy_hostname }}"
        lxc_vmid: "{{ bambuddy_vmid }}"
        lxc_storage: "{{ bambuddy_storage }}"
        lxc_template: "{{ bambuddy_template }}"
        lxc_cores: "{{ bambuddy_cores }}"
        lxc_memory: "{{ bambuddy_memory }}"
        lxc_disk: "{{ bambuddy_disk }}"
        lxc_bridge: "{{ bambuddy_bridge }}"
        lxc_vlan: "{{ bambuddy_vlan }}"
        lxc_tags: "{{ bambuddy_tags | join(';') }}"
        lxc_packages:
          - ca-certificates
          - curl
          - ffmpeg
          - npm
          - nodejs
          - python3
          - python3-venv
          - tar
        lxc_nfs_server: ""
        lxc_nfs_export: ""
        lxc_nfs_mountpoint: ""

    - name: Prepare Bambuddy account and application directory
      ansible.builtin.include_tasks: ../../../tasks/service_directories.yml
      vars:
        service_directory_vmid: "{{ lxc_resolved_vmid }}"
        service_directory_user: bambuddy
        service_directory_home: "{{ bambuddy_install_dir }}"
        service_directories:
          - path: "{{ bambuddy_install_dir }}"
            mode: "0755"

    - name: Read managed Bambuddy version
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - runuser
          - -u
          - bambuddy
          - --
          - cat
          - "{{ bambuddy_install_dir }}/.ansible-version"
      register: bambuddy_managed_version
      changed_when: false
      failed_when: bambuddy_managed_version.rc not in [0, 1]
      check_mode: false

    - name: Download pinned Bambuddy release
      ansible.builtin.get_url:
        url: "{{ bambuddy_release_url }}"
        dest: "/tmp/bambuddy-{{ bambuddy_version }}-{{ lxc_resolved_vmid }}.tar.gz"
        checksum: "{{ bambuddy_release_checksum }}"
        mode: "0600"
      when: >-
        not ansible_check_mode and
        (bambuddy_managed_version.rc != 0 or
         bambuddy_managed_version.stdout | trim != bambuddy_version)

    - name: Push Bambuddy release into container
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ lxc_resolved_vmid }}"
          - "/tmp/bambuddy-{{ bambuddy_version }}-{{ lxc_resolved_vmid }}.tar.gz"
          - /root/ansible-bambuddy-release.tar.gz
          - --perms
          - "0600"
      changed_when: true
      when: >-
        bambuddy_managed_version.rc != 0 or
        bambuddy_managed_version.stdout | trim != bambuddy_version

    - name: Install pinned Bambuddy release
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - bash
          - -ceu
          - |
            systemctl stop bambuddy 2>/dev/null || true
            runuser -u bambuddy -- bash -ceu '
              directory="$1"
              version="$2"
              tar -xzf - -C "$directory" --strip-components=1
              python3 -m venv "$directory/venv"
              "$directory/venv/bin/pip" install --disable-pip-version-check -r "$directory/requirements.txt"
              cd "$directory/frontend"
              npm ci
              NODE_OPTIONS=--max-old-space-size=3072 npm run build
              mkdir -p "$directory/data" "$directory/logs"
              marker=$(mktemp "$directory/.version.XXXXXXXXXX")
              trap '\''rm -f "$marker"'\'' EXIT
              printf "%s\n" "$version" > "$marker"
              chmod 0644 "$marker"
              mv -Tf -- "$marker" "$directory/.ansible-version"
            ' bambuddy-install "$1" "$2" < /root/ansible-bambuddy-release.tar.gz
            rm -f /root/ansible-bambuddy-release.tar.gz
          - bambuddy-install
          - "{{ bambuddy_install_dir }}"
          - "{{ bambuddy_version }}"
      changed_when: true
      when: >-
        bambuddy_managed_version.rc != 0 or
        bambuddy_managed_version.stdout | trim != bambuddy_version

    - name: Render Bambuddy service on Proxmox host
      ansible.builtin.template:
        src: bambuddy.service.j2
        dest: "/tmp/bambuddy.service-{{ lxc_resolved_vmid }}"
        mode: "0600"
      register: bambuddy_config_render

    - name: Push Bambuddy service into container # noqa: no-handler
      ansible.builtin.command:
        argv:
          - pct
          - push
          - "{{ lxc_resolved_vmid }}"
          - "/tmp/bambuddy.service-{{ lxc_resolved_vmid }}"
          - /etc/systemd/system/bambuddy.service
          - --perms
          - "0644"
      register: bambuddy_config_push
      changed_when: true
      when: bambuddy_config_render.changed

    - name: Initialize Bambuddy environment without replacing local settings
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - runuser
          - -u
          - bambuddy
          - --
          - bash
          - -ceu
          - |
            if test ! -e "$1/.env"; then
              umask 027
              cat > "$1/.env"
              echo created
            fi
          - bambuddy-env
          - "{{ bambuddy_install_dir }}"
        stdin: "{{ lookup('template', 'bambuddy.env.j2') }}"
      register: bambuddy_env_init
      changed_when: bambuddy_env_init.stdout is search('created')
      no_log: true

    - name: Enable and restart Bambuddy
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - bash
          - -ceu
          - systemctl daemon-reload; systemctl enable bambuddy; systemctl restart bambuddy
      changed_when: true
      when: >-
        bambuddy_managed_version.rc != 0 or
        bambuddy_managed_version.stdout | trim != bambuddy_version or
        bambuddy_config_push.changed | default(false) or
        bambuddy_env_init.changed

    - name: Check Bambuddy service state
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - systemctl
          - is-active
          - --quiet
          - bambuddy
      register: bambuddy_service_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Start Bambuddy if stopped
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - systemctl
          - start
          - bambuddy
      changed_when: true
      when: bambuddy_service_state.rc != 0

    - name: Verify Bambuddy web service
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - curl
          - --fail
          - --silent
          - --show-error
          - "http://127.0.0.1:{{ bambuddy_port }}/"
      register: bambuddy_health
      retries: 12
      delay: 5
      until: bambuddy_health.rc == 0
      changed_when: false
      when: not ansible_check_mode
