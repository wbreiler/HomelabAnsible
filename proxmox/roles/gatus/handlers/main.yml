---
- name: Restart Gatus
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ lxc_resolved_vmid }}"
      - --
      - systemctl
      - restart
      - gatus
  changed_when: true
  when: not (gatus_guest_ssh | bool)

- name: Restart Gatus on SSH guest
  listen: Restart Gatus
  ansible.builtin.systemd_service:
    name: gatus
    state: restarted
    daemon_reload: true
  when: gatus_guest_ssh | bool
