---
- name: Resolve node currently hosting Gatus
  ansible.builtin.include_tasks: ../../../tasks/resolve_lxc_node.yml
  vars:
    lxc_lookup_hostname: "{{ gatus_hostname }}"
    lxc_fallback_node: "{{ gatus_node }}"

- name: Set up Gatus LXC on hosting node only
  when: proxmox_node_name | default(inventory_hostname) == lxc_current_node
  block:
    - name: Bootstrap Gatus container
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/create_lxc.yml"
      vars:
        lxc_hostname: "{{ gatus_hostname }}"
        lxc_vmid: "{{ gatus_vmid }}"
        lxc_storage: "{{ gatus_storage }}"
        lxc_template: "{{ gatus_template }}"
        lxc_cores: "{{ gatus_cores }}"
        lxc_memory: "{{ gatus_memory }}"
        lxc_disk: "{{ gatus_disk }}"
        lxc_bridge: "{{ gatus_bridge }}"
        lxc_vlan: "{{ gatus_vlan }}"
        lxc_tags: "{{ gatus_tags | join(';') }}"
        lxc_packages:
          - ca-certificates
          - curl
          - python3
          - tar
        lxc_nfs_server: ""
        lxc_nfs_export: ""
        lxc_nfs_mountpoint: ""

    - name: Prepare Gatus account and application directories
      ansible.builtin.include_tasks: ../../../tasks/service_directories.yml
      vars:
        service_directory_vmid: "{{ lxc_resolved_vmid }}"
        service_directory_user: gatus
        service_directory_home: "{{ gatus_install_dir }}"
        service_directories:
          - path: "{{ gatus_install_dir }}"
            mode: "0755"
          - path: "{{ gatus_data_dir }}"
            mode: "0750"

    - name: Read managed Gatus version
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - runuser
          - -u
          - gatus
          - --
          - cat
          - "{{ gatus_install_dir }}/.ansible-version"
      register: gatus_managed_version
      changed_when: false
      failed_when: gatus_managed_version.rc not in [0, 1]
      check_mode: false

    - name: Build and install pinned Gatus release
      when:
        - not ansible_check_mode
        - >-
          gatus_managed_version.rc != 0 or
          gatus_managed_version.stdout | trim != gatus_version
      block:
        - name: Download pinned Go toolchain
          ansible.builtin.get_url:
            url: "{{ gatus_go_url }}"
            dest: "/tmp/go-{{ gatus_go_version }}-{{ lxc_resolved_vmid }}.tar.gz"
            checksum: "{{ gatus_go_checksum }}"
            mode: "0600"

        - name: Download pinned Gatus source
          ansible.builtin.get_url:
            url: "{{ gatus_source_url }}"
            dest: "/tmp/gatus-src-{{ gatus_version }}-{{ lxc_resolved_vmid }}.tar.gz"
            checksum: "{{ gatus_source_checksum }}"
            mode: "0600"

        - name: Push Go toolchain into container
          ansible.builtin.command:
            argv:
              - pct
              - push
              - "{{ lxc_resolved_vmid }}"
              - "/tmp/go-{{ gatus_go_version }}-{{ lxc_resolved_vmid }}.tar.gz"
              - /root/ansible-gatus-toolchain.tar.gz
              - --perms
              - "0600"
          changed_when: true

        - name: Push Gatus source into container
          ansible.builtin.command:
            argv:
              - pct
              - push
              - "{{ lxc_resolved_vmid }}"
              - "/tmp/gatus-src-{{ gatus_version }}-{{ lxc_resolved_vmid }}.tar.gz"
              - /root/ansible-gatus-source.tar.gz
              - --perms
              - "0600"
          changed_when: true

        - name: Build Gatus binary from source
          ansible.builtin.command:
            argv:
              - pct
              - exec
              - "{{ lxc_resolved_vmid }}"
              - --
              - bash
              - -ceu
              - |
                build=$(mktemp -d /var/tmp/gatus-build.XXXXXXXXXX)
                trap 'rm -rf "$build" /root/ansible-gatus-toolchain.tar.gz /root/ansible-gatus-source.tar.gz' EXIT
                mkdir "$build/src" "$build/toolchain" "$build/tmp"
                tar -xzf /root/ansible-gatus-toolchain.tar.gz -C "$build/toolchain"
                tar -xzf /root/ansible-gatus-source.tar.gz -C "$build/src" --strip-components=1
                cd "$build/src"
                export PATH="$build/toolchain/go/bin:$PATH"
                export GOTOOLCHAIN=local
                export GOCACHE="$build/cache"
                export GOMODCACHE="$build/modcache"
                export TMPDIR="$build/tmp"
                export CGO_ENABLED=0
                go build -o "$build/gatus" .
                test -x "$build/gatus"
                install -m 0755 "$build/gatus" /root/ansible-gatus-built
          changed_when: true

        - name: Remove Gatus source/toolchain archives from Proxmox host
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "/tmp/go-{{ gatus_go_version }}-{{ lxc_resolved_vmid }}.tar.gz"
            - "/tmp/gatus-src-{{ gatus_version }}-{{ lxc_resolved_vmid }}.tar.gz"

        - name: Install Gatus binary
          ansible.builtin.command:
            argv:
              - pct
              - exec
              - "{{ lxc_resolved_vmid }}"
              - --
              - bash
              - -ceu
              - |
                systemctl stop gatus 2>/dev/null || true
                runuser -u gatus -- bash -ceu '
                  binary=$(mktemp "$1/.gatus.XXXXXXXXXX")
                  marker=$(mktemp "$1/.version.XXXXXXXXXX")
                  trap '\''rm -f "$binary" "$marker"'\'' EXIT
                  cat > "$binary"
                  chmod 0755 "$binary"
                  mv -Tf -- "$binary" "$1/gatus"
                  printf "%s\n" "$2" > "$marker"
                  chmod 0644 "$marker"
                  mv -Tf -- "$marker" "$1/.ansible-version"
                ' gatus-install "$1" "$2" < /root/ansible-gatus-built
                rm -f /root/ansible-gatus-built
              - gatus-install
              - "{{ gatus_install_dir }}"
              - "{{ gatus_version }}"
          changed_when: true

    - name: Build list of managed application health endpoints
      ansible.builtin.set_fact:
        gatus_app_endpoints: >-
          {{
            gatus_app_endpoints | default([]) +
            ([{'name': item.name, 'url': item.url}]
             if (item.enabled | bool) and (item.url | default('') | length > 0)
             else [])
          }}
      loop:
        - name: Forgejo
          enabled: "{{ install_forgejo | default(false) }}"
          url: "{{ forgejo_health_url | default('') }}"
        - name: Homebridge
          enabled: "{{ install_homebridge | default(false) }}"
          url: "{{ homebridge_health_url | default('') }}"
        - name: Gitea Mirror
          enabled: "{{ install_gitea_mirror | default(false) }}"
          url: "{{ gitea_mirror_health_url | default('') }}"
        - name: Prowlarr
          enabled: "{{ install_prowlarr | default(false) }}"
          url: "{{ prowlarr_health_url | default('') }}"
        - name: Radarr
          enabled: "{{ install_radarr | default(false) }}"
          url: "{{ radarr_health_url | default('') }}"
        - name: Seerr
          enabled: "{{ install_seerr | default(false) }}"
          url: "{{ seerr_health_url | default('') }}"
        - name: Spoolman
          enabled: "{{ install_spoolman | default(false) }}"
          url: "{{ spoolman_health_url | default('') }}"
        - name: Pocket ID
          enabled: "{{ install_pocket_id | default(false) }}"
          url: "{{ pocket_id_health_url | default('') }}"
        - name: Sonarr
          enabled: "{{ install_sonarr | default(false) }}"
          url: "{{ sonarr_health_url | default('') }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Render Gatus configuration
      ansible.builtin.set_fact:
        gatus_config: "{{ lookup('template', 'config.yaml.j2') }}"
      no_log: true

    - name: Read installed Gatus configuration
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - runuser
          - -u
          - gatus
          - --
          - cat
          - "{{ gatus_install_dir }}/config.yaml"
      register: gatus_config_current
      changed_when: false
      failed_when: gatus_config_current.rc not in [0, 1]
      no_log: true
      check_mode: false

    - name: Install Gatus configuration
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - runuser
          - -u
          - gatus
          - --
          - bash
          - -ceu
          - |
            temporary=$(mktemp "$1/.config.XXXXXXXXXX")
            trap 'rm -f "$temporary"' EXIT
            cat > "$temporary"
            chmod 0600 "$temporary"
            mv -Tf -- "$temporary" "$1/config.yaml"
          - gatus-config
          - "{{ gatus_install_dir }}"
        stdin: "{{ gatus_config }}"
        stdin_add_newline: false
      when: >-
        gatus_config_current.rc != 0 or
        gatus_config_current.stdout != gatus_config | trim
      changed_when: true
      notify: Restart Gatus
      no_log: true

    - name: Restrict Gatus configuration permissions
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - runuser
          - -u
          - gatus
          - --
          - bash
          - -ceu
          - |
            if test "$(stat -c %a -- "$1")" != 600; then
              chmod 0600 -- "$1"
              echo changed
            fi
          - gatus-config-mode
          - "{{ gatus_install_dir }}/config.yaml"
      register: gatus_config_mode
      changed_when: gatus_config_mode.stdout | trim == 'changed'

    - name: Render Gatus service
      ansible.builtin.set_fact:
        gatus_service: "{{ lookup('template', 'gatus.service.j2') }}"

    - name: Read installed Gatus service
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - cat
          - /etc/systemd/system/gatus.service
      register: gatus_service_current
      changed_when: false
      failed_when: gatus_service_current.rc not in [0, 1]
      check_mode: false

    - name: Install Gatus service
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - tee
          - /etc/systemd/system/gatus.service
        stdin: "{{ gatus_service }}"
        stdin_add_newline: false
      when: >-
        gatus_service_current.rc != 0 or
        gatus_service_current.stdout != gatus_service | trim
      changed_when: true
      notify: Restart Gatus

    - name: Enable and start Gatus
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - systemctl
          - enable
          - --now
          - gatus
      register: gatus_service_enable
      changed_when: "'Created symlink' in gatus_service_enable.stderr"

    - name: Apply Gatus changes
      ansible.builtin.meta: flush_handlers

    - name: Verify Gatus service is active
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - systemctl
          - is-active
          - --quiet
          - gatus
      changed_when: false

    - name: Verify Gatus web interface
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ lxc_resolved_vmid }}"
          - --
          - curl
          - --fail
          - --silent
          - --show-error
          - "http://127.0.0.1:{{ gatus_port }}/health"
      register: gatus_health
      retries: 12
      delay: 5
      until: gatus_health.rc == 0
      changed_when: false
      when: not ansible_check_mode
