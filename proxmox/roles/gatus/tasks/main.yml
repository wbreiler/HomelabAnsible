---
- name: Validate Gatus configuration
  ansible.builtin.assert:
    that:
      - gatus_version | length > 0
      - gatus_source_checksum is match('^sha256:[0-9a-f]{64}$')
      - gatus_go_version | length > 0
      - gatus_go_checksum is match('^sha256:[0-9a-f]{64}$')
      - gatus_port | int >= 1
      - gatus_port | int <= 65535
    fail_msg: >-
      Gatus requires a pinned version, SHA-256 source checksum, a pinned Go
      toolchain with SHA-256 checksum, and a TCP port from 1 to 65535.

- name: Configure Gatus through the existing node workflow
  ansible.builtin.include_tasks: lxc.yml
  when: not (gatus_guest_ssh | bool)

- name: Configure Gatus directly on an existing guest
  ansible.builtin.include_tasks: guest.yml
  when: gatus_guest_ssh | bool
