---
- name: Restart LXC application update timer
  ansible.builtin.systemd_service:
    name: lxc-app-updates.timer
    daemon_reload: true
    enabled: "{{ lxc_app_updates_enabled | bool }}"
    state: "{{ 'restarted' if lxc_app_updates_enabled | bool else 'stopped' }}"
  when: not ansible_check_mode
