---
maintenance_queries_enabled: true
maintenance_queries_app_updates_enabled: false
maintenance_queries_platform: pve
maintenance_queries_node: "{{ inventory_hostname }}"
maintenance_queries_secret_dir: "{{ playbook_dir }}"
maintenance_queries_model: gpt-4.1-mini
maintenance_queries_daily_call_limit: 10
maintenance_queries_script: /usr/local/sbin/homelab-status
maintenance_queries_config: /etc/homelab-status.json
maintenance_queries_state: /var/lib/homelab-status
maintenance_queries_discord: >-
  {{ lookup('ansible.builtin.file', maintenance_queries_secret_dir ~ '/.maintenance-repairs-discord.json') | from_json }}
maintenance_queries_openai_api_key: >-
  {{ lookup('ansible.builtin.file', maintenance_queries_secret_dir ~ '/.maintenance-briefs-openai-key') | trim }}
