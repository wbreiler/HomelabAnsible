---
- name: Validate PXE HTTP configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  listen: Reload PXE HTTP service

- name: Reload PXE HTTP service
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: Restart PXE proxy
  ansible.builtin.systemd_service:
    name: pxe-proxy
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Restart PXE TFTP service
  ansible.builtin.service:
    name: tftpd-hpa
    state: restarted
