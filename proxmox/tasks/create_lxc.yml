---
# Configure an existing Terraform-owned LXC. Never create or start a guest.
# Required vars: lxc_hostname, lxc_packages.
# Optional: lxc_nfs_server, lxc_nfs_export, lxc_nfs_mountpoint.
# Sets: lxc_resolved_vmid, found by hostname on the resolved hosting node.

- name: Find existing container by hostname
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      pct list |
        awk -v hostname={{ lxc_hostname | quote }} \
          'NR > 1 && $3 == hostname { print $1 }'
    executable: /bin/bash
  register: _lxc_existing_vmid
  changed_when: false
  check_mode: false

- name: Require an existing Terraform-provisioned container
  ansible.builtin.assert:
    that:
      - _lxc_existing_vmid.stdout | trim | length > 0
    fail_msg: >-
      Container {{ lxc_hostname }} is absent. Provision it with Terraform before
      running application configuration. Ansible does not create guests.

- name: Resolve existing VMID
  ansible.builtin.set_fact:
    lxc_resolved_vmid: "{{ _lxc_existing_vmid.stdout | trim }}"

- name: Require the existing container to be running
  ansible.builtin.command:
    cmd: pct status {{ lxc_resolved_vmid }}
  register: _lxc_status
  changed_when: false
  check_mode: false
  failed_when: >-
    _lxc_status.rc != 0 or 'status: running' not in _lxc_status.stdout

- name: Wait for container to be ready
  ansible.builtin.command:
    cmd: pct exec {{ lxc_resolved_vmid }} -- echo ok
  register: _lxc_ready
  until: _lxc_ready.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  check_mode: false

- name: Configure apt-cacher-ng proxy inside container
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ lxc_resolved_vmid }}"
      - --
      - bash
      - -c
      - |
        set -eu
        host="$1"
        port="$2"
        path=/etc/apt/apt.conf.d/99proxy
        desired=$(printf 'Acquire::http { Proxy "http://%s:%s"; }\n' "$host" "$port")
        if test -f "$path" && test "$(cat "$path")" = "$desired"; then
          echo unchanged
        else
          printf '%s\n' "$desired" > "$path"
          echo changed
        fi
      - apt-proxy
      - "{{ apt_proxy_host | default('10.10.40.175') }}"
      - "{{ apt_proxy_port | default(3142) | string }}"
  register: _lxc_apt_proxy
  changed_when: _lxc_apt_proxy.stdout | trim == 'changed'
  when:
    - not ansible_check_mode
    - configure_apt_proxy | default(true) | bool

- name: Install packages
  ansible.builtin.command:
    cmd: >
      pct exec {{ lxc_resolved_vmid }} --
      bash -c "DEBIAN_FRONTEND=noninteractive apt-get update -qq &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y -q {{ lxc_packages | join(' ') }}"
  register: _lxc_apt
  changed_when: "'0 upgraded, 0 newly installed' not in _lxc_apt.stdout"
  when: not ansible_check_mode

- name: Add SSH public key to container
  ansible.builtin.command:
    cmd: >
      pct exec {{ lxc_resolved_vmid }} -- bash -c
      "mkdir -p /root/.ssh && chmod 700 /root/.ssh;
      if grep -qF '{{ lookup('file', '~/.ssh/lxc.pub') }}'
      /root/.ssh/authorized_keys 2>/dev/null; then
      echo unchanged; else
      echo '{{ lookup('file', '~/.ssh/lxc.pub') }}'
      >> /root/.ssh/authorized_keys && echo changed; fi"
  register: _lxc_ssh_key
  changed_when: _lxc_ssh_key.stdout | trim == 'changed'
  when: not ansible_check_mode

- name: Create NFS mountpoint
  ansible.builtin.command:
    cmd: pct exec {{ lxc_resolved_vmid }} -- mkdir -p {{ lxc_nfs_mountpoint }}
  changed_when: false
  when:
    - not ansible_check_mode
    - lxc_nfs_server | default('') | length > 0

- name: Add NFS fstab entry
  ansible.builtin.command:
    cmd: >
      pct exec {{ lxc_resolved_vmid }} -- bash -c
      "grep -q '{{ lxc_nfs_server }}:{{ lxc_nfs_export }}' /etc/fstab ||
      echo '{{ lxc_nfs_server }}:{{ lxc_nfs_export }}
      {{ lxc_nfs_mountpoint }} nfs defaults,_netdev 0 0' >> /etc/fstab"
  changed_when: true
  when:
    - not ansible_check_mode
    - lxc_nfs_server | default('') | length > 0

- name: Mount NFS share
  ansible.builtin.command:
    cmd: >
      pct exec {{ lxc_resolved_vmid }} -- bash -c
      "mountpoint -q {{ lxc_nfs_mountpoint }} || mount {{ lxc_nfs_mountpoint }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - lxc_nfs_server | default('') | length > 0
