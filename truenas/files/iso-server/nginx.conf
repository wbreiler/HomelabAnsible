worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  server {
    listen 80;
    root /media;
    disable_symlinks on;
    location / { autoindex on; }
    location ~ (^|/)\. { deny all; }
  }
}
