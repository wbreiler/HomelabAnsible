# TrueNAS custom-app Compose configuration for erebus.

services:
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    restart: unless-stopped
    command: >-
      --host 0.0.0.0
      --port 8080
      --models-preset /models/preset.ini
      --n-gpu-layers 999
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: GPU-fd41aa84-6ce4-f656-47f7-a49a6ff6fad3
    ports:
      - "8080:8080"
    volumes:
      - /mnt/gaia/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - GPU-fd41aa84-6ce4-f656-47f7-a49a6ff6fad3
              capabilities:
                - gpu
