# TrueNAS custom-app Compose configuration for erebus.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: GPU-fd41aa84-6ce4-f656-47f7-a49a6ff6fad3
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - /mnt/gaia/appdata/ollama:/root/.ollama
      - /mnt/gaia/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - GPU-fd41aa84-6ce4-f656-47f7-a49a6ff6fad3
              capabilities:
                - gpu
