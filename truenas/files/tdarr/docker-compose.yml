# TrueNAS custom-app Compose configuration for erebus.
# Tdarr runs as root so it can modify files across the existing media libraries.

services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:2.86.01
    container_name: tdarr
    restart: unless-stopped
    ports:
      - "10.10.20.3:8265:8265"
      - "10.10.20.3:8266:8266"
    environment:
      TZ: America/Chicago
      PUID: "0"
      PGID: "0"
      UMASK_SET: "002"
      serverIP: 0.0.0.0
      serverPort: "8266"
      webUIPort: "8265"
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: "7"
      nodeName: erebus-rtx5050
      nodeType: mapped
      priority: "0"
      pollInterval: "2000"
      startPaused: "true"
      transcodegpuWorkers: "1"
      transcodecpuWorkers: "0"
      healthcheckgpuWorkers: "0"
      healthcheckcpuWorkers: "1"
      auth: "true"
      openBrowser: "false"
      maxLogSizeMB: "10"
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: GPU-fd41aa84-6ce4-f656-47f7-a49a6ff6fad3
    volumes:
      - /mnt/gaia/appdata/tdarr/server:/app/server
      - /mnt/gaia/appdata/tdarr/config:/app/configs
      - /mnt/gaia/appdata/tdarr/logs:/app/logs
      - /mnt/gaia/media:/media
      - /mnt/gaia/appdata/tdarr/transcode_cache:/temp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - GPU-fd41aa84-6ce4-f656-47f7-a49a6ff6fad3
              capabilities:
                - gpu
    logging:
      options:
        max-size: 10m
        max-file: "5"
