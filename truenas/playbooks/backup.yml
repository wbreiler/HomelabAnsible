---
- name: Back up TrueNAS configuration securely
  hosts: truenas
  gather_facts: false
  vars:
    truenas_backup_remote_path: /tmp/erebus-config-backup.tar
    truenas_backup_local_path: >-
      {{ playbook_dir }}/../artifacts/erebus-config-2026-09-24.tar

  tasks:
    - name: Transfer configuration archive
      block:
        - name: Export archive to a new protected remote file
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - "{{ lookup('file', playbook_dir + '/../files/backup-config.py') }}"
            stdin: "{{ {'mode': 'export', 'target': truenas_backup_remote_path} | to_json }}"
          register: truenas_backup_export
          changed_when: true
          no_log: true

        - name: Create private local transfer directory
          ansible.builtin.tempfile:
            state: directory
            prefix: truenas-backup-
          delegate_to: localhost
          register: truenas_backup_staging

        - name: Fetch configuration archive into private staging
          ansible.builtin.fetch:
            src: "{{ truenas_backup_remote_path }}"
            dest: "{{ truenas_backup_staging.path }}/config.tar"
            flat: true
            fail_on_missing: true
          no_log: true

        - name: Publish protected local backup without replacing existing files
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - "{{ lookup('file', playbook_dir + '/../files/backup-config.py') }}"
            stdin: >-
              {{ {'mode': 'publish', 'source': truenas_backup_staging.path + '/config.tar',
                  'target': truenas_backup_local_path} | to_json }}
          delegate_to: localhost
          changed_when: true
          no_log: true
      always:
        - name: Remove local transfer directory
          ansible.builtin.file:
            path: "{{ truenas_backup_staging.path }}"
            state: absent
          delegate_to: localhost
          when: truenas_backup_staging.path is defined

        - name: Remove remote temporary configuration archive
          ansible.builtin.file:
            path: "{{ truenas_backup_remote_path }}"
            state: absent
          when: truenas_backup_export is defined and truenas_backup_export is succeeded
