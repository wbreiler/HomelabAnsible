---
- name: Deploy only the LANCache custom application
  hosts: truenas
  gather_facts: false
  tags: [apps]
  tasks:
    - name: Require deployment opt-in and local configuration
      ansible.builtin.assert:
        that:
          - ansible_check_mode or truenas_allow_changes | bool
          - lancache_bind_address is defined
          - lancache_network_name is defined
          - lancache_network_name | length > 0
          - lancache_root is defined
          - lancache_upstream_dns is defined
          - lancache_upstream_dns != lancache_bind_address
          - lancache_root.startswith('/mnt/')
    - name: Read current LANCache application configuration
      ansible.builtin.raw: >-
        midclt call app.query '[["name","=","lancache"]]'
        '{"extra":{"retrieve_config":true}}'
      check_mode: false
      register: lancache_query
      changed_when: false
    - name: Inspect the existing application network
      ansible.builtin.raw: "docker network inspect {{ lancache_network_name | quote }}"
      check_mode: false
      register: lancache_network
      changed_when: false
    - name: Require an existing macvlan network
      ansible.builtin.assert:
        that:
          - (lancache_network.stdout | from_json | first).Driver == 'macvlan'
    - name: Create dedicated LANCache directories
      ansible.builtin.file:
        path: "{{ lancache_root }}/{{ item }}"
        state: directory
        mode: '0755'
      loop: [cache, logs]
    - name: Reconcile only LANCache
      ansible.builtin.include_tasks: ../roles/truenas_entities/tasks/app.yml
      vars:
        truenas_entities_apps: "{{ lancache_query.stdout | from_json }}"
        desired_app:
          name: lancache
          custom_app: true
          state: RUNNING
          custom_compose_config:
            services:
              dns:
                image: lancachenet/lancache-dns@sha256:6e046a40e9f0467b1df97ca2ba9b8b7c0d4404736a349c0f8df11fa212871a03
                restart: unless-stopped
                environment:
                  USE_GENERIC_CACHE: 'true'
                  LANCACHE_IP: "{{ lancache_bind_address }}"
                  UPSTREAM_DNS: "{{ lancache_upstream_dns }}"
                  TZ: "{{ lancache_timezone | default('Etc/UTC') }}"
                network_mode: service:monolithic
                depends_on: [monolithic]
                logging:
                  driver: json-file
                  options:
                    max-size: 10m
                    max-file: '3'
              monolithic:
                image: lancachenet/monolithic@sha256:155817065b13cc427aa0014acc34bbb389591400d7639c95abcfcfb2230ad7f0
                restart: unless-stopped
                environment:
                  UPSTREAM_DNS: "{{ lancache_upstream_dns }}"
                  CACHE_DISK_SIZE: "{{ lancache_disk_size | default('1000g') }}"
                  CACHE_INDEX_SIZE: 250m
                  MIN_FREE_DISK: 100g
                  CACHE_MAX_AGE: 3650d
                  TZ: "{{ lancache_timezone | default('Etc/UTC') }}"
                networks:
                  cache:
                    ipv4_address: "{{ lancache_bind_address }}"
                volumes:
                  - "{{ lancache_root }}/cache:/data/cache"
                  - "{{ lancache_root }}/logs:/data/logs"
                logging:
                  driver: json-file
                  options:
                    max-size: 10m
                    max-file: '3'
            networks:
              cache:
                external: true
                name: "{{ lancache_network_name }}"
