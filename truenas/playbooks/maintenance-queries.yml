---
- name: Configure local read-only Discord inspection worker
  hosts: truenas
  become: true
  gather_facts: false
  vars:
    maintenance_queries_platform: truenas
    maintenance_queries_secret_dir: "{{ playbook_dir }}/../../proxmox"
    maintenance_queries_state: /root/homelab-status
    maintenance_queries_script: /root/homelab-status/homelab-status.py
    maintenance_queries_config: /root/homelab-status/config.json
    maintenance_queries_cron:
      description: Homelab Discord read-only inspections
      command: /usr/bin/timeout 900 /usr/bin/python3 /root/homelab-status/homelab-status.py --config /root/homelab-status/config.json
      user: root
      enabled: true
      stdout: true
      stderr: true
      schedule: {minute: '*', hour: '*', dom: '*', month: '*', dow: '*'}
  tasks:
    - name: Require explicit configuration gate
      ansible.builtin.assert:
        that: truenas_allow_changes | default(false) | bool or ansible_check_mode

    - name: Install shared query worker without Linux timers
      ansible.builtin.include_role:
        name: maintenance_queries

    - name: Read existing query schedule
      ansible.builtin.command:
        argv: [midclt, call, cronjob.query]
      check_mode: false
      changed_when: false
      register: maintenance_queries_cron_query
      no_log: true

    - name: Reconcile only the bot query schedule
      ansible.builtin.include_tasks: ../roles/truenas_entities/tasks/keyed_entity.yml
      vars:
        truenas_entity_desired: "{{ maintenance_queries_cron }}"
        truenas_entity_current: "{{ maintenance_queries_cron_query.stdout | from_json }}"
        truenas_entity_match: {description: Homelab Discord read-only inspections}
        truenas_entity_state: present
        truenas_entity_method: cronjob
        truenas_entity_label: Homelab Discord read-only inspection schedule
        truenas_entity_omit: []
