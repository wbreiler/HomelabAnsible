---
- name: Deploy only the spotDL custom application
  hosts: truenas
  gather_facts: false
  vars:
    spotdl_ytdlp_version: '2026.8.19'
    spotdl_ytdlp_sha256: 1d57897e94c6665a0a6f9bc54b34e584284e32c034ffab3a7df25d8f7b24eedf
  tasks:
    - name: Require explicit deployment opt-in and local configuration
      ansible.builtin.assert:
        that:
          - ansible_check_mode or truenas_allow_changes | bool
          - spotdl_config_path is defined
          - spotdl_music_path is defined
          - spotdl_bind_address is defined
          - spotdl_uid is defined
          - spotdl_gid is defined
          - spotdl_image is defined
    - name: Create dedicated spotDL directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ spotdl_uid }}"
        group: "{{ spotdl_gid }}"
        mode: "0750"
      loop:
        - "{{ spotdl_config_path }}"
        - "{{ spotdl_music_path }}"
        - "{{ spotdl_config_path }}/yt-dlp-{{ spotdl_ytdlp_version }}"
    - name: Download pinned YouTube extractor wheel
      ansible.builtin.get_url:
        url: >-
          https://files.pythonhosted.org/packages/69/b2/8cd1613f56eed7ceb64fbd4df3f1c01246bfb098e6f398228bafda22b80b/yt_dlp-2026.8.19-py3-none-any.whl
        dest: "{{ spotdl_config_path }}/yt_dlp-{{ spotdl_ytdlp_version }}.whl"
        checksum: "sha256:{{ spotdl_ytdlp_sha256 }}"
        owner: "{{ spotdl_uid }}"
        group: "{{ spotdl_gid }}"
        mode: '0644'
    - name: Extract verified YouTube extractor
      ansible.builtin.unarchive:
        src: "{{ spotdl_config_path }}/yt_dlp-{{ spotdl_ytdlp_version }}.whl"
        dest: "{{ spotdl_config_path }}/yt-dlp-{{ spotdl_ytdlp_version }}"
        remote_src: true
        owner: "{{ spotdl_uid }}"
        group: "{{ spotdl_gid }}"
        creates: "{{ spotdl_config_path }}/yt-dlp-{{ spotdl_ytdlp_version }}/yt_dlp/version.py"
      when: not ansible_check_mode
    - name: Install bounded web metadata workaround
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname }}/files/spotdl/web_search.py"
        dest: "{{ spotdl_config_path }}/web_search.py"
        owner: "{{ spotdl_uid }}"
        group: "{{ spotdl_gid }}"
        mode: '0644'
    - name: Read current spotDL application configuration
      ansible.builtin.raw: >-
        midclt call app.query '[["name","=","spotdl"]]'
        '{"extra":{"retrieve_config":true}}'
      check_mode: false
      register: spotdl_query
      changed_when: false
    - name: Reconcile only spotDL
      ansible.builtin.include_tasks: ../roles/truenas_entities/tasks/app.yml
      vars:
        truenas_entities_apps: "{{ spotdl_query.stdout | from_json }}"
        desired_app:
          name: spotdl
          custom_app: true
          state: RUNNING
          custom_compose_config:
            services:
              spotdl:
                image: "{{ spotdl_image }}"
                restart: unless-stopped
                user: "{{ spotdl_uid }}:{{ spotdl_gid }}"
                entrypoint:
                  - /app/.venv/bin/python
                  - /opt/spotdl/web_search.py
                labels:
                  local.spotdl.web-search-sha256: >-
                    {{ lookup('file', (playbook_dir | dirname) + '/files/spotdl/web_search.py') | hash('sha256') }}
                command:
                  - web
                  - --host
                  - 0.0.0.0
                  - --port
                  - '8800'
                  - --keep-alive
                  - --web-use-output-dir
                  - --output
                  - /music/{artists} - {title}.{output-ext}
                environment:
                  TZ: "{{ spotdl_timezone | default('Etc/UTC') }}"
                  PYTHONPATH: /opt/spotdl/yt-dlp
                ports:
                  - "{{ spotdl_bind_address }}:8800:8800"
                volumes:
                  - "{{ spotdl_config_path }}/yt-dlp-{{ spotdl_ytdlp_version }}:/opt/spotdl/yt-dlp:ro"
                  - "{{ spotdl_config_path }}/web_search.py:/opt/spotdl/web_search.py:ro"
                  - "{{ spotdl_config_path }}:/home/spotdl/.config/spotdl"
                  - "{{ spotdl_music_path }}:/music"
                healthcheck:
                  test:
                    - CMD
                    - /app/.venv/bin/python
                    - -c
                    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/', timeout=5)"
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 60s
    # The persistent config mount hides the image's bundled Deno binary.
    - name: Install the YouTube JavaScript runtime in persistent configuration
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - ix-spotdl-spotdl-1
          - /app/.venv/bin/spotdl
          - --download-deno
        creates: "{{ spotdl_config_path }}/deno"
